# 감상평 비속어 목록 고치기
#  - 데이터 관리(F9) 화면의 "감상평 비속어 관리 → 모든 기기에 적용" 버튼으로 실행
#  - js/badwords-custom.js 를 고쳐 커밋 → Vercel 자동 배포
name: 감상평 비속어 목록

on:
  workflow_dispatch:
    inputs:
      add_words:
        description: '추가할 비속어 (쉼표로 구분)'
        required: false
        default: ''
      add_allow:
        description: '추가할 정상 단어(예외) (쉼표로 구분)'
        required: false
        default: ''
      remove:
        description: '목록에서 지울 단어 (쉼표로 구분)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: badwords
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 목록 고치기
        env:
          ADD_WORDS: ${{ inputs.add_words }}
          ADD_ALLOW: ${{ inputs.add_allow }}
          REMOVE: ${{ inputs.remove }}
        run: node tools/update-badwords.mjs
      - name: 올리기
        run: |
          git add js/badwords-custom.js
          if git diff --cached --quiet; then
            echo "바뀐 단어가 없습니다."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "감상평 비속어 목록 수정"
            git push
          fi
