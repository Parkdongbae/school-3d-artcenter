# 사이트 기본 설정 저장 (전시 제목 · 학교 · 기간 · 구글 시트 · 로고)
#  - 사이트의 "사이트 설정" 화면(처음 설정 / F9 → 사이트 설정)에서 실행
#  - js/config.js · assets/logo.* · js/logo.js 를 고쳐 커밋 → Vercel 자동 배포
name: 사이트 기본 설정

on:
  workflow_dispatch:
    inputs:
      settings:
        description: '설정 값 (JSON)'
        required: true
        default: '{}'
      logo:
        description: '로고 (비우면 그대로 / remove / data:image/...)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: site-config
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 설정 바꾸기
        env:
          SETTINGS: ${{ inputs.settings }}
          LOGO: ${{ inputs.logo }}
        run: node tools/apply-config.mjs
      - name: 올리기
        run: |
          git add -A js/config.js js/logo.js assets
          if git diff --cached --quiet; then
            echo "바뀐 설정이 없습니다."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "사이트 기본 설정 변경"
            git push
          fi
