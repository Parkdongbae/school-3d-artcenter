# 사이트 설정 변경 (모든 기기 자동 확인 켜기/끄기·간격)
#  - 데이터 관리(F9) 화면의 "모든 기기에 적용" 버튼으로 실행
#  - js/config.js 의 autoSync / autoSyncSeconds 를 고쳐 커밋 → Vercel 자동 배포
name: 사이트 설정 변경

on:
  workflow_dispatch:
    inputs:
      autosync:
        description: '자동 확인 (true / false)'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      seconds:
        description: '확인 간격(초)'
        required: true
        default: '120'

permissions:
  contents: write

concurrency:
  group: site-settings
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 설정 바꾸기
        env:
          AUTOSYNC: ${{ inputs.autosync }}
          SECONDS_IN: ${{ inputs.seconds }}
        run: |
          SEC=$(echo "$SECONDS_IN" | tr -cd '0-9'); [ -z "$SEC" ] && SEC=120
          [ "$SEC" -lt 30 ] && SEC=30; [ "$SEC" -gt 3600 ] && SEC=3600
          [ "$AUTOSYNC" = "true" ] && AS=true || AS=false
          sed -i -E "s/^(\s*autoSync:\s*)(true|false),/\1$AS,/" js/config.js
          sed -i -E "s/^(\s*autoSyncSeconds:\s*)[0-9]+,/\1$SEC,/" js/config.js
          grep -nE "autoSync(Seconds)?:" js/config.js
      - name: 올리기
        run: |
          git add js/config.js
          if git diff --cached --quiet; then
            echo "바뀐 설정이 없습니다."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "사이트 설정: 자동 확인 ${{ inputs.autosync }} · ${{ inputs.seconds }}초"
            git push
          fi
